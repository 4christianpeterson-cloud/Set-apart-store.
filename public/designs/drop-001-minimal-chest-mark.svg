<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <title>SET APART — minimal chest mark</title>
  <desc>Small white cross above the SET APART wordmark, designed for left-chest printing on black garments.</desc>
  <rect width="1200" height="1200" fill="none"/>
  <g fill="#fff">
    <rect x="570" y="210" width="60" height="220" rx="2"/>
    <rect x="490" y="290" width="220" height="60" rx="2"/>
  </g>
  <text x="600" y="565" fill="#fff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="102" font-weight="900" letter-spacing="-4">SET APART</text>
  <text x="600" y="645" fill="#fff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="10">LIVE DIFFERENT</text>
  <path d="M365 700H835" stroke="#fff" stroke-width="4"/>
  <text x="600" y="765" fill="#fff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="7">ROMANS 12:2</text>
</svg>